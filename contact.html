<!-- ═══════════════════════════════════════
     CONTACT HERO
═══════════════════════════════════════ -->
<section class="contact-hero" id="contact-hero">
  <div class="contact-hero__inner">
<span class="reveal-line">
    <div class="contact-hero__title-row">
         <span class="contact-hero__badge">
        <img src="./Images/badge-mark.png" alt="" class="contact-hero__badge-icon">
      </span>
      <h1 class="contact-hero__title">  Let's work <br><span class="reveal-line"> together</h1></span>
    </div>
     
    <p class="contact-hero__subtitle">
       Please fill out the form, and I will get back to you within <strong>24 hours.</strong>
    </p>

    <form class="contact-form" id="contactForm" action="https://api.web3forms.com/submit" method="POST">
      <!-- Web3Forms config -->
      <input type="hidden" name="access_key" value="94406b95-7c8c-4f31-8640-00dbd6b45c56">
      <input type="hidden" name="subject" value="New message — Design with Mawuli">
      <input type="hidden" name="from_name" value="Design with Mawuli — Contact Form">
      <input type="checkbox" name="botcheck" style="display: none;" tabindex="-1" aria-hidden="true" autocomplete="off">

      <div class="contact-form__group">
        <input type="text" name="name" id="name" class="contact-form__input" placeholder="Name" aria-label="Name" required>
      </div>

      <div class="contact-form__group">
        <input type="email" name="email" id="email" class="contact-form__input" placeholder="Email" aria-label="Email" required>
      </div>

      <div class="contact-form__group">
        <input type="text" name="services" id="services" class="contact-form__input" placeholder="Services" aria-label="Services">
      </div>

      <div class="contact-form__group contact-form__group--textarea">
        <label for="organization" class="contact-form__label">Tell us about your Organization</label>
        <textarea name="organization" id="organization" class="contact-form__textarea" rows="5"></textarea>
      </div>

      <div class="contact-form__group">
        <input type="text" name="message" id="message" class="contact-form__input" placeholder="leave a message" aria-label="Message">
      </div>

      <div class="contact-form__submit-row">
        <p class="contact-form__status" id="formStatus" role="status" aria-live="polite"></p>

        <button type="submit" class="contact-form__submit" id="formSubmit">
          <span class="contact-form__submit-text">send</span>
          <span class="contact-form__submit-icon"><i class="ti ti-arrow-right"></i></span>
        </button>
      </div>
    </form>

  </div>

<div class="foot">
