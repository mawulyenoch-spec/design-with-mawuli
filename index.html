<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dogbey Mawuli Enoch — Designer & Developer</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Paytone+One&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ═══════════════════════════════════════
       NAVBAR
  ═══════════════════════════════════════ -->
  <nav class="navbar">

    <!-- Left: Logo / Name -->
    <div class="nav-logo">
      <div class="nav-avatar">
        <!-- Avatar image goes here later -->
        <span class="avatar-placeholder"></span>
      </div>
      <span class="nav-name">Mawuli</span>
    </div>

    <!-- Centre: Links -->
    <ul class="nav-links">
      <li><a href="#home" class="nav-link active">Home</a></li>
      <li><a href="#works" class="nav-link">Works</a></li>
      <li><a href="#about" class="nav-link">About</a></li>
    </ul>

    <!-- Right: CTA -->
    <div class="nav-cta">
      <a href="#contact" class="btn-contact">Get in touch</a>
    </div>

  </nav>


  <!-- ═══════════════════════════════════════
       HERO SECTION
  ═══════════════════════════════════════ -->
  <section class="hero" id="home">

    <!-- Floating 3-D objects (left side) — images added later -->
    <div class="hero-objects">
      <div class="object-cube">
        <!-- Mac-mini / cube 3-D image goes here -->
      </div>
      <div class="object-worm">
        <!-- Inflatable worm / green 3-D object goes here -->
      </div>
    </div>

    <!-- Centre text block -->
    <div class="hero-content">
      <p class="hero-greeting">
        <span class="word">Hi,</span>
        <span class="word">I</span>
        <span class="word">am</span>
      </p>
      <h1 class="hero-name">
        <span class="word">Dogbey</span>
        <span class="word">Mawuli</span>
        <span class="word">Enoch</span>
      </h1>
      <div class="hero-titles">
        <span class="word">Designer/Developer</span>
        <div class="magician"><span class="word">• Visual Magician</span></div>
      </div>
      <p class="hero-bio">
        <span class="word">Turning caffeine, creativity, and code into smooth digital experiences that look  </span>
        <span class="word">good, move fast, feel alive , even bugs stop to admire the design.</span>
      </p>
    </div>

    <!-- Right: Character image — added later -->
    <div class="hero-character">
      <!-- 3-D character / portrait image goes here -->
    </div>

    <!-- Bottom accent bar -->
    <div class="hero-bar"></div>

  </section>


  <script src="./main.js"></script>
</body>
</html>
